name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
        if: runner.os != 'Linux'
        env:
          PROMPUFF_SCREENSHOTS: ${{ runner.temp }}/screenshots
      # Linux runs under Xvfb, so the X11 hotkey test can grab keys and press them with XTest.
      - name: dotnet test (under Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libxtst6 > /dev/null
          xvfb-run -a -s "-screen 0 1280x800x24" dotnet test --no-build -c Release
        env:
          PROMPUFF_SCREENSHOTS: ${{ runner.temp }}/screenshots
      # The headless UI tests save a PNG of every state they visit; look at them after UI changes.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
